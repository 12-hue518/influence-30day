<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>影響力の正体 30日チャレンジ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F2A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="30日チャレンジ">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<style>
  :root{
    --ink:#1F2A44;
    --ink-soft:#3c4a6b;
    --paper:#FBF8F2;
    --paper-line:#E4DCC9;
    --gold:#B8862B;
    --gold-soft:#F5EEDD;
    --done:#8A9A7E;
    --text:#2A2A28;
    --text-muted:#7c7568;
    --serif: "Noto Serif JP", "Hiragino Mincho ProN", serif;
    --sans: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px 80px;}

  header.top{
    text-align:left;
    padding-bottom:20px;
    border-bottom:2px solid var(--ink);
    margin-bottom:24px;
  }
  .kicker{
    font-family:var(--sans);
    font-size:12px;
    letter-spacing:.08em;
    color:var(--gold);
    margin-bottom:6px;
  }
  h1{
    font-family:var(--serif);
    font-size:26px;
    line-height:1.4;
    margin:0 0 4px;
    color:var(--ink);
    font-weight:600;
  }
  .sub{
    font-family:var(--serif);
    font-size:14px;
    color:var(--text-muted);
    margin:0;
  }

  .progress-row{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin:22px 0 28px;
  }
  .streak-num{
    font-family:var(--serif);
    font-size:44px;
    font-weight:600;
    color:var(--ink);
    line-height:1;
  }
  .streak-label{
    font-size:13px;
    color:var(--text-muted);
  }
  .bar-track{
    height:3px;
    background:var(--paper-line);
    width:100%;
    margin-top:14px;
    position:relative;
  }
  .bar-fill{
    height:3px;
    background:var(--gold);
    transition:width .4s ease;
  }

  .week{margin-bottom:8px;}
  .week-head{
    font-family:var(--serif);
    font-size:15px;
    color:var(--ink);
    padding:18px 0 8px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--paper-line);
  }
  .week-head .wk-count{
    font-size:12px;
    color:var(--text-muted);
    font-family:var(--sans);
  }

  .day{
    display:flex;
    gap:14px;
    padding:16px 0;
    border-bottom:1px solid var(--paper-line);
    align-items:flex-start;
    cursor:pointer;
  }
  .day:last-child{border-bottom:none;}
  .day-num{
    font-family:var(--serif);
    font-size:13px;
    color:var(--text-muted);
    width:44px;
    flex-shrink:0;
    padding-top:2px;
  }
  .day-num .n{
    display:block;
    font-size:20px;
    color:var(--ink);
    font-weight:600;
  }
  .day.done .day-num .n{color:var(--done);}
  .day-body{flex:1;min-width:0;}
  .day-title{
    font-size:14.5px;
    font-weight:600;
    color:var(--text);
    margin:0 0 4px;
  }
  .day.done .day-title{color:var(--text-muted);text-decoration:line-through;text-decoration-color:var(--paper-line);}
  .day-jdi{
    font-family:var(--serif);
    font-size:13.5px;
    line-height:1.75;
    color:var(--text);
    margin:0;
  }
  .day.done .day-jdi{color:var(--text-muted);}
  .check{
    width:22px;height:22px;
    border:1.5px solid var(--ink);
    flex-shrink:0;
    margin-top:2px;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s ease;
  }
  .day.done .check{
    background:var(--done);
    border-color:var(--done);
  }
  .check svg{opacity:0;width:13px;height:13px;}
  .day.done .check svg{opacity:1;}

  .footer-note{
    margin-top:40px;
    padding-top:20px;
    border-top:2px solid var(--ink);
    font-family:var(--serif);
    font-size:13px;
    color:var(--text-muted);
    line-height:1.8;
  }

  /* modal */
  .modal-bg{
    position:fixed;inset:0;
    background:rgba(31,42,68,.55);
    display:none;
    align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--paper);
    max-width:340px;
    width:100%;
    padding:24px;
    text-align:center;
  }
  .modal h2{
    font-family:var(--serif);
    font-size:19px;
    color:var(--ink);
    margin:14px 0 6px;
  }
  .modal p.mini{
    font-size:12.5px;
    color:var(--text-muted);
    margin:0 0 18px;
  }
  #shareCanvas{
    width:100%;
    height:auto;
    display:block;
    margin-bottom:18px;
  }
  .modal-actions{display:flex;gap:10px;}
  .btn{
    flex:1;
    padding:12px;
    font-size:13.5px;
    font-family:var(--sans);
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }
  .btn.primary{
    background:var(--ink);
    color:#fff;
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="kicker">『影響力の正体』公式ワークブック</div>
    <h1>30日実践チャレンジ</h1>
    <p class="sub">「知っている」を「できる」に変える30日間</p>
  </header>

  <div class="progress-row">
    <div>
      <div class="streak-num" id="streakNum">0</div>
      <div class="streak-label">連続達成日数</div>
    </div>
    <div style="flex:1">
      <div class="streak-label" id="progressText">0 / 30 完了</div>
      <div class="bar-track"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
    </div>
  </div>

  <div id="weeks"></div>

  <div class="footer-note">
    5日達成するごとに、シェア用のカードが作れます。がんばりを、そのままSNSに置いていってください。
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <canvas id="shareCanvas" width="1080" height="1080"></canvas>
    <h2 id="modalTitle">5日連続、達成です</h2>
    <p class="mini">画像を保存して、シェアできます</p>
    <div class="modal-actions">
      <button class="btn" id="closeBtn">閉じる</button>
      <button class="btn primary" id="saveBtn">画像を保存</button>
    </div>
  </div>
</div>

<script>
const DATA = [
  {week:1, theme:"土台をつくる週", items:[
    {day:1, num:"001", title:"「なぜ」を１行、紙に書く", jdi:"あなたが今やっている仕事や、挑戦していることについて、「なぜ、自分はこれをやっているのか」を、１行だけ紙に書いてみてください。すらすら書けなくても大丈夫。その問いと向き合うことから、すべてが始まります。"},
    {day:2, num:"003", title:"「あなたならできる」を伝える", jdi:"今日、誰かひとりに「あなたなら、これはできるよ」と、具体的な理由を添えて伝えてみてください。「前にあれができたんだから」と、過去の小さな成功をひとつ思い出させる。それだけで、相手の足は、すっと前に出やすくなります。"},
    {day:3, num:"004", title:"未来の解像度を上げる問いをする", jdi:"動いてほしい誰かに、こう聞いてみてください。「それが叶ったとき、どこで、誰と、何をしている？」。相手の未来の解像度を一段上げる問いが、説得よりもよほど人を動かします。"},
    {day:4, num:"005", title:"よく会う５人を書き出す", jdi:"自分のまわりにいる、よく会う５人の名前を書き出してみてください。そのうえで、今日、あなた自身がその場の〝ふつう〟を一段上げる動きを、ひとつだけしてみる。あなたの基準が、まわりの基準になります。"},
    {day:5, num:"006", title:"「三年は続ける」と紙に書いて貼る", jdi:"今やっていることに、「何があっても三年は続ける」と紙に書き、日付を入れて、目に入る場所に貼ってみてください。"},
    {day:6, num:"007", title:"見返りを期待せず先に差し出す", jdi:"家族か同僚にひとつだけ、見返りを期待せず先に差し出してみましょう。お茶一杯でも、削った鉛筆でも、資料一枚でも。"},
    {day:7, num:"009", title:"共通点になりそうな事実を用意する", jdi:"次に誰かと会う前に、相手との「共通点になりそうな事実」を１つ用意しておきましょう。出身地でも趣味でも家族構成でも、何でもかまいません。"},
  ]},
  {week:2, theme:"人を惹きつける週", items:[
    {day:8, num:"010", title:"相手の話し方に、さりげなく合わせる", jdi:"次に誰かと話すとき、相手の話すスピードやうなずきに、さりげなく合わせてみてください。言葉ではなく体で「わかりますよ」を伝える練習です。"},
    {day:9, num:"011", title:"肩書きを自己紹介の冒頭に置く", jdi:"自分の経歴・経験・数字の中から、肩書きとして打ち出せるものを１つ選び、自己紹介の冒頭に置いてみてください。"},
    {day:10, num:"012", title:"大切な相手と、会う回数を増やす", jdi:"大切にしたい相手とは、長く一度会うより、短くても何度も顔を合わせる回数を、意識して増やしてみてください。"},
    {day:11, num:"015", title:"資料のばらつきをひとつそろえる", jdi:"自分の資料や書類を見わたして、フォント・色・余白にばらつきがあれば、ひとつでよいのでそろえてみてください。"},
    {day:12, num:"016", title:"「素敵」の理由を五つ書き出す", jdi:"「いいな」と思った人やお店を１つ選び、なぜ素敵なのかを、五つ具体的に書き出してみてください。感覚を設計図に変える練習です。"},
    {day:13, num:"017", title:"最初の０.５秒の場所を完璧に整える", jdi:"相手が最初の０・５秒で見る場所を１つ選び、そこだけ完璧に整えてみましょう。"},
    {day:14, num:"018", title:"話を区切り、「続きはまた」と予告する", jdi:"次に何かを伝えるとき、話を途中で区切り、「続きはまた」と予告してみてください。すべてを一度に渡さず、あえて未完了の状態を残すことが、相手の脳を引き止める鍵です。"},
  ]},
  {week:3, theme:"言葉と仕組みで動かす週", items:[
    {day:15, num:"020", title:"言い方を３パターン書いてみる", jdi:"いつものお願いや声かけを１つ選び、語尾・主語・視点を入れ替えた言い方を、３パターン書いてみてください。"},
    {day:16, num:"021", title:"具体的な場面を描写して添える", jdi:"誰かに何かをすすめるとき、「まず明日の朝、○○する場面」をひとつだけ具体的に描写して、添えてみてください。"},
    {day:17, num:"022", title:"「〜なので」をひとつ足す", jdi:"頼みごとや声かけに、「〜なので、〜してください」の形を１つ足してみてください。理由はささやかでかまいません。"},
    {day:18, num:"023", title:"「もし〜なら」を一緒に決めて手渡す", jdi:"動いてほしい相手（部下・子ども・お客さま）を１人思い浮かべ、「もし(いつもの場面)になったら、(してほしい行動)をする」を一緒に決めて手渡してみてください。"},
    {day:19, num:"025", title:"小さな本音をひとつ打ち明ける", jdi:"信頼を深めたい相手に、これまで言えずにいた小さな本音を、ひとつだけ打ち明けてみてください。"},
    {day:20, num:"027", title:"「最初の一歩」を半分にする方法を渡す", jdi:"動かしたい相手に取ってほしい行動を1つ選び、その人の「最初の一歩を半分にする方法」を3つ書き出して、ひとつ手渡してみてください。"},
    {day:21, num:"029", title:"選択肢を数え、３つ以下に絞る", jdi:"相手に示している選択肢の数を、数えてみてください。４つ以上あるなら、３つ以下に絞ってみましょう。"},
    {day:22, num:"030", title:"「数字」と「期日」を入れて伝える", jdi:"部下・子ども・チームに頼みたいことを１つ、「数字」と「期日」を入れた言葉に書き換えて、相手に伝えてみてください。"},
  ]},
  {week:4, theme:"巻き込み・つながり・自分を守る週", items:[
    {day:23, num:"032", title:"今月の目標を、誰かに宣言する", jdi:"今月の目標を１つ、信頼できる誰かに、口に出して宣言してみてください。紙に書いて、誰かに渡してもかまいません。"},
    {day:24, num:"034", title:"久しぶりの知人に、自分から連絡する", jdi:"今月、毎日会う身近な人ではなく、半年以上会っていない知人に、自分から１人だけ連絡してみてください。"},
    {day:25, num:"036", title:"「みんなで繰り返すこと」をひとつ作る", jdi:"自分のチームや家庭に、「みんなで決まって繰り返すこと」を１つつくってみてください。月に１回でも、かまいません。"},
    {day:26, num:"038", title:"「できない」と言った回数を数える", jdi:"今日１日、自分や相手の口から出た「できない」「難しい」「無理」の数を数えてみてください。まずは気づくことから、です。"},
    {day:27, num:"040", title:"「まだできない」に言いかえる", jdi:"自分や相手の「できない」「難しい」を今から「まだできない」「まだ難しい」に言いかえてみてください。あなたの一語が、相手を動かします。"},
    {day:28, num:"042", title:"ネガティブな決めつけをやめる", jdi:"自分が部下・子ども・家族に、習慣的に言っているネガティブな決めつけを１つ書き出し、口にするのをやめてみてください。"},
    {day:29, num:"044", title:"見えない頑張りを数字に翻訳する", jdi:"自分の「見えない頑張り」を、年数や回数などの〝数字〟に翻訳して、１つ書き出してみてください。"},
    {day:30, num:"050", title:"「誰のために使うか」を書いて貼る", jdi:"本書で学んだ影響力を「誰を、幸せにするために使うか」を１行で書いて、目に入る場所に貼ってみてください。"},
  ]},
];

const TOTAL = 30;
let state = {};

async function loadState(){
  try{
    const raw = localStorage.getItem('influence-30day-status');
    state = raw ? JSON.parse(raw) : {};
  }catch(e){
    state = {};
  }
  render();
}

async function saveState(){
  try{
    localStorage.setItem('influence-30day-status', JSON.stringify(state));
  }catch(e){
    console.error('save failed', e);
  }
}

function currentStreak(){
  let s = 0;
  for(let d=1; d<=TOTAL; d++){
    if(state[d]){ s++; } else { break; }
  }
  return s;
}

function completedCount(){
  return Object.values(state).filter(Boolean).length;
}

function render(){
  const container = document.getElementById('weeks');
  container.innerHTML = '';
  DATA.forEach(w=>{
    const wkDone = w.items.filter(it=>state[it.day]).length;
    const weekEl = document.createElement('div');
    weekEl.className = 'week';
    weekEl.innerHTML = `<div class="week-head"><span>Week${w.week}　${w.theme}</span><span class="wk-count">${wkDone}/${w.items.length}</span></div>`;
    w.items.forEach(it=>{
      const done = !!state[it.day];
      const row = document.createElement('div');
      row.className = 'day' + (done ? ' done' : '');
      row.innerHTML = `
        <div class="day-num">出典${it.num}<span class="n">${it.day}</span></div>
        <div class="day-body">
          <p class="day-title">${it.title}</p>
          <p class="day-jdi">${it.jdi}</p>
        </div>
        <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg></div>
      `;
      row.addEventListener('click', ()=>toggleDay(it.day));
      weekEl.appendChild(row);
    });
    container.appendChild(weekEl);
  });

  const streak = currentStreak();
  const done = completedCount();
  document.getElementById('streakNum').textContent = streak;
  document.getElementById('progressText').textContent = `${done} / ${TOTAL} 完了`;
  document.getElementById('barFill').style.width = (done/TOTAL*100) + '%';
}

function toggleDay(day){
  const wasOn = !!state[day];
  state[day] = !wasOn;
  saveState();
  render();
  if(!wasOn){
    const streak = currentStreak();
    if(streak > 0 && streak % 5 === 0){
      showShareCard(streak);
    }
  }
}

function drawShareCard(streak){
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // background
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#1F2A44');
  grad.addColorStop(1, '#111826');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // gold hairline frame
  ctx.strokeStyle = '#B8862B';
  ctx.lineWidth = 3;
  ctx.strokeRect(48, 48, W-96, H-96);

  ctx.textAlign = 'center';

  ctx.fillStyle = '#B8862B';
  ctx.font = '28px sans-serif';
  ctx.fillText('『影響力の正体』30日チャレンジ', W/2, 190);

  ctx.fillStyle = '#FBF8F2';
  ctx.font = 'bold 220px serif';
  ctx.fillText(streak, W/2, 500);

  ctx.font = '40px serif';
  ctx.fillText('日、連続達成', W/2, 580);

  ctx.fillStyle = '#8A9A7E';
  ctx.font = '26px sans-serif';
  ctx.fillText(streak >= TOTAL ? '30日、走りきりました。' : `残り ${TOTAL - streak} 日`, W/2, 660);

  // divider
  ctx.strokeStyle = 'rgba(184,134,43,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(W/2-100, 740);
  ctx.lineTo(W/2+100, 740);
  ctx.stroke();

  ctx.fillStyle = 'rgba(251,248,242,0.7)';
  ctx.font = '24px sans-serif';
  ctx.fillText('「知っている」を「できる」に変える30日間', W/2, 800);
  ctx.fillText('中島侑子', W/2, 850);
}

function showShareCard(streak){
  drawShareCard(streak);
  document.getElementById('modalTitle').textContent =
    streak >= TOTAL ? '30日間、走りきりました' : `${streak}日連続、達成です`;
  document.getElementById('modalBg').classList.add('open');
}

document.getElementById('closeBtn').addEventListener('click', ()=>{
  document.getElementById('modalBg').classList.remove('open');
});
document.getElementById('saveBtn').addEventListener('click', ()=>{
  const canvas = document.getElementById('shareCanvas');
  const link = document.createElement('a');
  link.download = 'influence-30day-streak.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

loadState();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
